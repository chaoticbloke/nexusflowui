<article class="d-flex flex-column gap-2" [class.align-items-end]="message().role === 'USER'" [class.align-items-start]="message().role === 'ASSISTANT'">
  @if (message().role === 'ASSISTANT') {
    <div class="d-flex align-items-center gap-2 text-secondary small fw-semibold"><i class="bi bi-stars text-primary"></i><span>NexusFlow AI</span></div>
  }
  @if (message().role === 'ASSISTANT') {
    <div class="mw-100 rounded-3 border bg-light px-3 py-2 text-body" style="max-width: 620px" [innerHTML]="formattedContent()"></div>
  } @else {
    <div class="mw-100 rounded-3 bg-primary px-3 py-2 text-white" style="max-width: 620px; white-space: pre-wrap; overflow-wrap: anywhere">{{ message().content }}</div>
  }
</article>
